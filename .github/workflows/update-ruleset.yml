name: Update Rulesets

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-ruleset
  cancel-in-progress: false

env:
  GO_VERSION: '1.27'

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        run: go build -o srs-box ./cmd/srs-box

      # 单个源失败不是 CI 失败：srs-box 逐规则集隔离，照常退出 0。
      # 只有一个规则集都没产出（真·基础设施坏了）才会退出 1 并让这一步红。
      - name: Generate rulesets
        run: ./srs-box build --report run-report.json --github-summary

      # 三态发布（覆盖 / 保留 / 清孤儿）连同"名单不可信时跳过清理"那一态，
      # 全在 srs-box publish 里，并且有测试。
      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./srs-box publish --report run-report.json
